<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GiftMuse Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

            text-align: center;
        }

        .login-box h1 {
            font-family: Georgia, serif;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            background: black;
            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }

        .login-btn:hover {
            background: #444;
        }

        .back {
            display: block;

            margin-top: 20px;

            color: black;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>GiftMuse </h1>

        <p>Login to your account</p>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>


        <a href="login.html" class="back">
            
        </a>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let email =
                    document.getElementById("email").value;

                let password =
                    document.getElementById("password").value;


                if (email !== "" && password !== "") {

                    alert("Login Successful! 🎉");

                    window.location.href = "index.html";

                }

            });

    </script>

</body>

</html>
