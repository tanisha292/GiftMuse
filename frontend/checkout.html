<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - GiftMuse</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffafa;
        }

        .checkout {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .order {
            margin: 20px 0;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #555;
        }

    </style>

</head>

<body>

<div class="checkout">

    <h1>Checkout 🛍️</h1>

    <div id="order"></div>

    <input type="text" placeholder="Your Name">

    <input type="text" placeholder="Phone Number">

    <input type="text" placeholder="Delivery Address">

    <button onclick="placeOrder()">
        Place Order
    </button>

</div>


<script>

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];

let order = document.getElementById("order");

let total = 0;

if (cart.length === 0) {

    order.innerHTML =
        "<p>Your cart is empty.</p>";

} else {

    cart.forEach(function(item) {

        total += Number(item.price);

        order.innerHTML +=
            "<p>" +
            item.name +
            " - ৳" +
            item.price +
            "</p>";

    });

    order.innerHTML +=
        "<hr><strong>Total: ৳" +
        total +
        "</strong>";

}


function placeOrder() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;

    }

    alert("Order placed successfully! 🎉");

    localStorage.removeItem("cart");

    window.location.href = "index.html";

}

</script>

</body>

</html>
