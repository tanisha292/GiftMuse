<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find a Gift - GiftMuse</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 40px;

            background: white;

            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            margin: 0;
        }

        .header a {
            text-decoration: none;
            color: black;
        }

        .find-box {
            width: 450px;
            max-width: 90%;

            margin: 70px auto;

            background: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .find-box h2 {
            text-align: center;

            font-family: Georgia, serif;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 18px;

            margin-bottom: 8px;

            font-weight: bold;
        }

        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        .find-btn {
            width: 100%;

            margin-top: 30px;

            padding: 13px;

            background: black;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;
        }

        .find-btn:hover {
            background: #444;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: black;
        }

    </style>

</head>


<body>

    <header class="header">

        <h1>GiftMuse 🎁</h1>

        <a href="index.html">
            Home
        </a>

    </header>


    <div class="find-box">

        <h2>Find the Perfect Gift </h2>


        <label>
            Who are you buying for?
        </label>

        <select id="person">

            <option value="">
                Select
            </option>

            <option value="her">
                For Her
            </option>

            <option value="him">
                For Him
            </option>

            <option value="father">
                Father
            </option>
            <option value="Mother">
                Mother
            </option>

        </select>


        <label>
            What is the occasion?
        </label>

        <select id="occasion">

            <option value="">
                Select
            </option>

            <option value="birthday">
                Birthday
            </option>

            <option value="anniversary">
                Anniversary
            </option>

            <option value="graduation">
                Graduation
            </option>

            <option value="special">
                Just Because
            </option>

        </select>


        <label>
            Budget
        </label>

        <select id="budget">

            <option value="">
                Select
            </option>

            <option value="low">
                Under ৳1,500
            </option>

            <option value="medium">
                ৳1,500 - ৳2,000
            </option>

            <option value="high">
                Above ৳2,000
            </option>

        </select>


     <button class="find-btn" onclick="findGift()">
    Find My Gift 🎁
</button>

        <a href="index.html" class="back">
        
        </a>

    </div>


    <script>

        function findGift() {

            let person =
                document.getElementById("person").value;

            let occasion =
                document.getElementById("occasion").value;

            let budget =
                document.getElementById("budget").value;


            if (
                person === "" ||
                occasion === "" ||
                budget === ""
            ) {

                alert(
                    "Please select all options."
                );

                return;

            }


            localStorage.setItem(
                "person",
                person
            );

            localStorage.setItem(
                "occasion",
                occasion
            );

            localStorage.setItem(
                "budget",
                budget
            );


            window.location.href ="results.html";


        }

    </script>


</body>

</html>
